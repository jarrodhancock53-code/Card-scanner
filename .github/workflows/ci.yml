name: CI
on:
  push:
  pull_request:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s tools/tests -v

  swift-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (price lookup, match rule, recap, tracker, best frame)
        run: swift test
        working-directory: ios/Core

  ios-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios
      - name: Build for iOS Simulator (no signing)
        run: |
          xcodebuild build -project PackRipTracker.xcodeproj -scheme PackRipTracker \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -60
          exit ${PIPESTATUS[0]}
        working-directory: ios
