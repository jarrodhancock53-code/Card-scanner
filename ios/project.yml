name: PackRipTracker
options:
  bundleIdPrefix: dev.packrip
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  PackRipCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  PackRipTracker:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../data
        type: folder
    dependencies:
      - package: PackRipCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pack Rip Tracker
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Pack Rip Tracker uses the camera to recognize the cards you open.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.packrip.tracker
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
